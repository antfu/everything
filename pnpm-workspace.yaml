ignoreWorkspaceRootCheck: true
minimumReleaseAge: 0
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - undici-types

update:
  ignoreDeps:
    - typescript@7

autoInstallPeers: false
shellEmulator: true
packages: []

overrides:
  chokidar: ^5.0.0
  semver: ^7.8.5

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  pnpm: true
  sharp: true
  simple-git-hooks: true
  unrs-resolver: true

